name: Backend platform API

on:
  push:
    branches: ["main"]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    name: Lint, types, tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check --diff .
      - name: mypy
        run: mypy app tests
      - name: pytest
        run: pytest

  postgres:
    name: Tenant isolation and locking (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardtracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CARDTRACKER_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cardtracker_test
      CARDTRACKER_TEST_POSTGRES_URL: postgresql+psycopg://cardtracker_app:cardtracker_app@localhost:5432/cardtracker_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"

      - name: pytest against PostgreSQL
        run: pytest

      - name: Migration is reversible
        env:
          CARDTRACKER_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cardtracker_test
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: RLS is enabled on every tenant table
        env:
          PGPASSWORD: postgres
        run: |
          failed=0
          for table in users stock reservations reservation_lines stock_movements notifications idempotency_keys audit_events; do
            state=$(psql -h localhost -U postgres -d cardtracker_test -tAc \
              "select relrowsecurity from pg_class where relname = '$table' and relkind = 'r'")
            if [ "$state" != "t" ]; then
              echo "row level security is not enabled on $table"
              failed=1
            fi
          done
          exit "$failed"
