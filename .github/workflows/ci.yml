name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check --diff .
        continue-on-error: true

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest --cov --cov-report=term-missing

  smoke:
    name: Import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Tk
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pip install -r requirements.txt
      - name: Every module imports
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "main", "collection", "downloader", "importer",
              "models.card",
              "services.card_database", "services.sqlite_database",
              "services.card_collection", "services.pricing",
              "services.excel_importer", "services.excel_exporter",
              "services.image_loader",
              "ui.app", "ui.card_list",
          ]
          for name in modules:
              importlib.import_module(name)
          print(f"{len(modules)} modules imported cleanly")
          PY
