name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-env
        with:
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check --diff .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-env
        with:
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: mypy
        run: mypy .

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-env
        with:
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: bandit
        run: bandit -q -c pyproject.toml -r .
      - name: pip-audit
        run: ./scripts/audit_requirements.sh

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-env
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
          install-tk: "true"
      - name: Run tests
        run: pytest --cov --cov-branch --cov-report=term-missing

  sqlserver:
    name: SQL Server schema and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run disposable SQL Server checks
        env:
          CARDTRACKER_REQUIRE_SQLSERVER: "1"
        run: ./scripts/test_sqlserver.sh

  smoke:
    name: Import smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-env
        with:
          requirements: requirements.txt
          cache-dependency-path: requirements.txt
          install-tk: "true"
      - name: Every module imports
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "main", "collection", "downloader", "importer",
              "customer_app", "owner_app",
              "models.card",
              "services.card_database", "services.sqlite_database",
              "services.catalog_bootstrap",
              "services.card_collection", "services.card_lookup",
              "services.card_query", "services.pricing",
              "services.excel_importer", "services.excel_exporter",
              "services.image_loader", "services.shop_database",
              "services.spreadsheet", "services.mssql",
              "services.mssql_database",
              "tools.etl_scryfall", "tools.etl_stock",
              "ui.app", "ui.card_list", "ui.customer_app",
              "ui.dispatch", "ui.owner_app", "ui.shop_widgets",
          ]
          for name in modules:
              importlib.import_module(name)
          print(f"{len(modules)} modules imported cleanly")
          PY
