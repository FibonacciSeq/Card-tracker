services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cardtracker-sqlserver-test
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CardTracker!Test123"
      MSSQL_PID: "Developer"
    ports:
      - "14333:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data:
