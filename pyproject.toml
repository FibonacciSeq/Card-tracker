[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "card-tracker"
version = "0.1.0"
description = "Desktop aplikacija za pretragu Scryfall baze i vođenje MTG kolekcije"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aleksa Cvele" }]
keywords = ["magic-the-gathering", "scryfall", "tkinter", "inventory", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Inventory",
]
dependencies = [
    "requests>=2.31.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
# SQL Server backend. pyodbc is the usual choice on Windows (needs
# "ODBC Driver 18 for SQL Server"); pymssql needs no ODBC setup.
mssql = ["pyodbc>=5.0"]
mssql-pymssql = ["pymssql>=2.3"]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/aleksacvele/card-tracker"
Issues = "https://github.com/aleksacvele/card-tracker/issues"

[project.scripts]
card-tracker = "main:display_app"
card-tracker-customer = "customer_app:main"
card-tracker-owner = "owner_app:main"

[tool.setuptools]
py-modules = ["main", "collection", "downloader", "importer", "customer_app", "owner_app"]

[tool.setuptools.packages.find]
include = ["models*", "services*", "ui*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning", "error::ResourceWarning"]

[tool.coverage.run]
branch = true
omit = ["ui/*", "tests/*", "tools/*", "backend/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "venv", "build", "dist", "image_cache", "backend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, unused imports)
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear (mutable defaults, shadowed loop vars)
    "C4",   # comprehensions
    "G",    # logging best practices
    "RUF",  # ruff-specific checks
    "SIM",  # simplify
    "T20",  # flag leftover print() calls
]
ignore = [
    "E501",    # line length handled by the formatter
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert-heavy style and long parametrised tables.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
exclude = ["^build/", "^dist/", "^\\.venv/", "^venv/", "^image_cache/", "^backend/"]
explicit_package_bases = true
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
pretty = true

[tool.bandit]
exclude_dirs = [".git", ".venv", "venv", "build", "dist", "image_cache", "tests", "backend"]
# B608 is a heuristic that flags every f-string SQL statement, including the
# static fragments used by the catalog and shop backends. All user values are
# bound with placeholders; fragments are assembled only from fixed column,
# table, and status tuples. The SQL construction is reviewed in CONTRIBUTING.md.
skips = ["B608"]
