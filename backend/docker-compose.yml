services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cardtracker_owner
      POSTGRES_PASSWORD: cardtracker_owner
      POSTGRES_DB: cardtracker
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardtracker_owner -d cardtracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    env_file:
      - .env
    environment:
      CARDTRACKER_DATABASE_URL: postgresql+psycopg://cardtracker_app:cardtracker_app@db:5432/cardtracker
      CARDTRACKER_MIGRATION_DATABASE_URL: postgresql+psycopg://cardtracker_owner:cardtracker_owner@db:5432/cardtracker
      CARDTRACKER_AUTO_CREATE_TABLES: "false"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  worker:
    build: .
    env_file:
      - .env
    environment:
      CARDTRACKER_DATABASE_URL: postgresql+psycopg://cardtracker_app:cardtracker_app@db:5432/cardtracker
      CARDTRACKER_AUTO_CREATE_TABLES: "false"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.workers.expiry"]

  notifications:
    build: .
    env_file:
      - .env
    environment:
      CARDTRACKER_DATABASE_URL: postgresql+psycopg://cardtracker_app:cardtracker_app@db:5432/cardtracker
      CARDTRACKER_AUTO_CREATE_TABLES: "false"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.workers.notifications"]

volumes:
  pgdata:
